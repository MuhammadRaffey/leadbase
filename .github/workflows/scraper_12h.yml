name: 12-Hour Automated LeadBase Scraper

on:
  schedule:
    # Runs every 12 hours (at 00:00 and 12:00 UTC) automatically
    - cron: '0 0,12 * * *'
  # Allows you to trigger the scraper manually anytime with 1-click from GitHub web interface
  workflow_dispatch:

concurrency:
  group: scraper-12h
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    name: Scrape MOTUS & Upsert to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python_scraper/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python_scraper/requirements.txt

      - name: Verify scraper offline
        run: python -m unittest discover -s python_scraper/tests -v

      - name: Restore scan checkpoint
        uses: actions/cache/restore@v4
        with:
          path: motus_scraper_state_v10.json
          key: scraper-state-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scraper-state-v2-${{ runner.os }}-

      - name: Run 12-Hour Scraper Cycle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -u python_scraper/auto_scraper_12h.py --once --max-run-seconds 19800

      - name: Save scan checkpoint even after failure
        if: always() && hashFiles('motus_scraper_state_v10.json') != ''
        uses: actions/cache/save@v4
        with:
          path: motus_scraper_state_v10.json
          key: scraper-state-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
